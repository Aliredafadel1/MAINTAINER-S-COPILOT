services:

  vault:
    image: hashicorp/vault:1.17
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: changeme
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"   # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed-vault:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/seed_vault.py"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      SEED_LLM_API_KEY: ${SEED_LLM_API_KEY}
    depends_on:
      vault:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/migrate.py"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: copilot
      DB_USER: copilot
    depends_on:
      db:
        condition: service_healthy
      seed-vault:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: copilot
      DB_USER: copilot
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      OTLP_ENDPOINT: http://jaeger:4317
      MODELSERVER_URL: http://modelserver:8001
    volumes:
      - ./app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  modelserver:
    build:
      context: services/modelserver
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${MODELSERVER_PORT:-8001}:8001"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./prompts:/app/prompts:ro
      - ./services/modelserver/main.py:/app/main.py:ro
      - ./services/modelserver/routes:/app/routes:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      seed-vault:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  chatbot:
    build:
      context: services/chatbot
      dockerfile: Dockerfile
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "${CHATBOT_PORT:-8501}:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  widget:
    build:
      context: .
      dockerfile: services/widget/Dockerfile
    ports:
      - "${WIDGET_PORT:-8080}:80"

  host:
    build:
      context: demo/host
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-3000}:80"
    depends_on:
      - widget
      - api

volumes:
  db_data:
  minio_data:
  hf_cache:
