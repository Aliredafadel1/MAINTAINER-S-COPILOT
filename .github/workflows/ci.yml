name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint + type-check ────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint deps
        run: pip install ruff mypy types-requests types-PyYAML pydantic==2.9.2 structlog fastapi sqlalchemy pgvector anthropic hvac minio

      - name: Ruff lint
        run: ruff check app/ evals/ scripts/ services/modelserver/

      - name: Ruff format check
        run: ruff format --check app/ evals/ scripts/ services/modelserver/

      - name: Mypy
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  # ── 2. Unit tests ───────────────────────────────────────────────────────────
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ── 3. Docker Compose build ─────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build

  # ── 4. Smoke test (stack healthy + /health 200) ─────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Copy env template
        run: cp .env.example .env && echo "VAULT_ROOT_TOKEN=devroot" >> .env

      - name: Start stack
        run: docker compose up -d

      - name: Wait for api healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | python3 -m json.tool

      - name: Wait for modelserver healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "Modelserver healthy after ${i}s"; break
            fi
            sleep 2
          done

      - name: Smoke test API endpoints
        run: |
          # Health
          curl -sf http://localhost:8000/health
          # Register first user
          TOKEN=$(curl -sf -X POST http://localhost:8000/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","password":"testpass123"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          # RAG search (empty corpus is fine, just needs 200)
          curl -sf -X POST http://localhost:8000/rag/search \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"test","top_k":5}'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ── 5. Widget build ─────────────────────────────────────────────────────────
  widget-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: widget/package.json

      - name: Install widget deps
        run: npm ci
        working-directory: widget

      - name: Build widget
        run: npm run build
        working-directory: widget

      - name: Report bundle size
        run: |
          SIZE=$(wc -c < public/widget.iife.js)
          GZIP=$(gzip -c public/widget.iife.js | wc -c)
          echo "Bundle: ${SIZE} bytes raw, ${GZIP} bytes gzipped"

  # ── 6. Classifier eval (main branch only) ──────────────────────────────────
  eval-classifier:
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install requests pyyaml minio

      - name: Copy env + start stack
        run: |
          cp .env.example .env && echo "VAULT_ROOT_TOKEN=devroot" >> .env
          docker compose up -d modelserver
          for i in $(seq 1 60); do
            curl -sf http://localhost:8001/health && break || sleep 2
          done

      - name: Run classifier eval (all 3 models)
        env:
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: |
          python evals/eval_classifier.py \
            --modelserver-url http://localhost:8001 \
            --run-id "${{ github.sha }}"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: classifier-eval-${{ github.sha }}
          path: evals/results/classifier_eval_report.json

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ── 7. RAG eval (main branch only) ─────────────────────────────────────────
  eval-rag:
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: copilot
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt psycopg2-binary

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://copilot:testpass@localhost:5432/copilot
          DB_PASSWORD: testpass
        run: python scripts/migrate.py

      - name: Run RAG eval
        env:
          DATABASE_URL: postgresql://copilot:testpass@localhost:5432/copilot
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_URL: http://localhost:8000
        run: python evals/eval_rag.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-${{ github.sha }}
          path: evals/results/rag_eval_report.json
